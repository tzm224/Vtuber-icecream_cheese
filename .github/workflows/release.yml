name: Release macOS app
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    concurrency:
      group: cheese-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n install.sh scripts/build.sh scripts/uninstall.sh
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_assets.py
      - run: swift test
      - name: Resolve version
        run: |
          VERSION="$(tr -d '\n\r' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag must match VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build universal application
        run: bash scripts/build.sh
      - run: dist/CheesePet.app/Contents/MacOS/CheesePet --self-test
      - name: Smoke test packaged application
        run: |
          dist/CheesePet.app/Contents/MacOS/CheesePet &
          PET_PID=$!
          sleep 5
          kill -0 "$PET_PID"
          kill "$PET_PID"
      - name: Publish verified release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; preserving it. Bump VERSION to publish a new release."
            exit 0
          fi
          EXISTING_TAG="$(git ls-remote --tags origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | awk '/\^\{\}$/ { peeled=$1 } !/\^\{\}$/ { plain=$1 } END { print peeled ? peeled : plain }')"
          if [[ -n "$EXISTING_TAG" && "$EXISTING_TAG" != "$GITHUB_SHA" ]]; then
            echo "Existing v$VERSION tag points to a different commit; refusing to publish mismatched binaries." >&2
            exit 1
          fi
          cp docs/RELEASE_NOTES.md "$RUNNER_TEMP/release-notes.md"
          printf '\nSource commit: %s\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            dist/CheesePet-macOS-universal.zip dist/SHA256SUMS \
            --title "雪糕cheese v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
